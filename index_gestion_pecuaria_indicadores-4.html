<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17452f">
<meta name="description" content="Gestión Pecuaria: animales, reproducción, crías, gastos, ventas, inversión y ganancias.">
<link rel="manifest" href="manifest.json">
<title>Gestión Pecuaria</title>
<style>
:root{--green:#17452f;--green2:#236846;--bg:#f3f6f3;--card:#fff;--line:#dbe5de;--text:#172019;--muted:#68756d;--red:#a62e28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:14px 16px;box-shadow:0 2px 8px #0002}
header b{font-size:20px}header small{opacity:.85}
nav{position:sticky;top:67px;z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow:auto}
nav button{flex:0 0 auto;background:#fff;color:var(--text);border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 13px;font-weight:700}
nav button.on{color:var(--green);border-bottom-color:var(--green)}
main{max-width:1050px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stat small{color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
button{background:var(--green);color:#fff;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}
button.alt{background:#e7eee9;color:var(--green)}button.danger{background:#f6e2e0;color:var(--red)}
button.gray{background:#eef1ef;color:#34413a}
input,select,textarea{width:100%;padding:10px;margin:4px 0 9px;border:1px solid #ccd6ce;border-radius:9px;box-sizing:border-box;font:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:16px;overflow:auto}.modal.show{display:block}
.box{max-width:650px;margin:30px auto;background:#fff;border-radius:16px;padding:16px}
.badge{display:inline-block;background:#e8f0ea;color:var(--green);padding:3px 8px;border-radius:20px;font-size:11px}
.muted{color:var(--muted);font-size:13px}.empty{padding:18px;text-align:center;color:var(--muted)}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.kpi{font-size:28px;font-weight:800}.ok{color:#176b3b}.loss{color:var(--red)}
.notice{background:#eef7f0;border:1px solid #cfe4d4;color:#24583a;padding:12px;border-radius:10px;margin-bottom:12px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}header{top:0}nav{top:66px}}
</style>
</head>
<body>
<header><b>🐑 Gestión Pecuaria</b><br><small id="status">Guardado en este dispositivo</small></header>
<nav id="nav"></nav>
<main id="app"></main>

<div id="modal" class="modal"><div class="box">
  <div class="row between"><h2 id="mt"></h2><button class="alt" onclick="closeM()">✕</button></div>
  <div id="mb"></div>
</div></div>

<script>
const KEY='gestion_pecuaria_v3';
const tabs=[
 ['home','🏠 Inicio'],['animals','🐏 Animales'],['reproduction','❤️ Repro'],
 ['offspring','🍼 Crías'],['weights','⚖️ Pesajes'],['feed','🌾 Alimento'],
 ['vet','🩺 Veterinaria'],['finance','💰 Finanzas'],['sales','🛒 Ventas'],
 ['reports','📊 Reportes'],['indicators','📐 Indicadores'],['backup','💾 Respaldo']
];
const empty=()=>({animals:[],reproduction:[],offspring:[],weights:[],feed:[],vet:[],finance:[],sales:[]});
let data=loadData(), tab='home';

function loadData(){try{return Object.assign(empty(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return empty()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='✓ Guardado automáticamente en este dispositivo'}
function $(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function today(){return new Date().toISOString().slice(0,10)}
function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(){ $('nav').innerHTML=tabs.map(([id,t])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')">${t}</button>`).join('') }
function go(x){tab=x;render()}
function stat(a,b){return `<div class="card stat"><small>${a}</small><strong>${b}</strong></div>`}
function activeAnimals(){return data.animals.filter(a=>a.status==='Activo')}
function totalPurchase(){return data.animals.reduce((s,a)=>s+Number(a.purchase||0),0)}
function totalExpenses(){return data.finance.filter(x=>x.type==='Gasto').reduce((s,x)=>s+Number(x.amount||0),0)+data.feed.reduce((s,x)=>s+Number(x.cost||0),0)+data.vet.reduce((s,x)=>s+Number(x.cost||0),0)}
function totalSales(){return data.sales.reduce((s,x)=>s+Number(x.total||0),0)}
function totalIncome(){return totalSales()+data.finance.filter(x=>x.type==='Ingreso').reduce((s,x)=>s+Number(x.amount||0),0)}
function profit(){return totalIncome()-totalExpenses()-totalPurchase()}
function pct(num,den){return den>0?(Number(num||0)/Number(den)*100).toFixed(2):'0.00'}
function recovered(){return totalSales()>=totalPurchase()}
function animalOpts(filter=()=>true){return data.animals.filter(filter).map(a=>`<option value="${a.id}">${esc(a.tag)} · ${esc(a.breed||'')}</option>`).join('')}

const V={
home:()=>`<h2>Dashboard</h2>
<div class="grid">${stat('Animales activos',activeAnimals().length)}${stat('Hembras',activeAnimals().filter(a=>a.sex==='Hembra').length)}
${stat('Machos',activeAnimals().filter(a=>a.sex==='Macho').length)}${stat('Crías',data.offspring.length)}
${stat('Ventas',money(totalSales()))}${stat('Gastos',money(totalExpenses()))}${stat('Inversión compra',money(totalPurchase()))}
${stat('Ganancia neta',`<span class="${profit()>=0?'ok':'loss'}">${money(profit())}</span>`)}</div>
<div class="notice"><b>${recovered()?'✓ Inversión recuperada':'⏳ Inversión pendiente'}</b><br>
Ventas acumuladas: ${money(totalSales())} · Inversión en compras: ${money(totalPurchase())}<br>
${recovered()?'Ya recuperaste el dinero de compra registrado.':'Faltan '+money(Math.max(0,totalPurchase()-totalSales()))+' para recuperar la inversión de compra.'}</div>
<div class="card"><h3>Acciones rápidas</h3><div class="row">
<button onclick="animalForm()">+ Animal</button><button onclick="weightForm()">⚖️ Pesaje</button><button onclick="reproForm()">❤️ Servicio</button>
<button onclick="criaForm()">🍼 Cría</button><button onclick="feedForm()">🌾 Alimento</button><button onclick="vetForm()">🩺 Veterinaria</button>
<button onclick="expenseForm()">💸 Gasto</button><button onclick="saleForm()">🛒 Venta</button></div></div>`,

animals:()=>`<div class="row between"><h2>Animales</h2><button onclick="animalForm()">+ Registrar</button></div><div id="list"></div>`,
reproduction:()=>`<div class="row between"><h2>Reproducción</h2><button onclick="reproForm()">+ Servicio</button></div><div id="list"></div>`,
offspring:()=>`<div class="row between"><h2>Crías</h2><button onclick="criaForm()">+ Registrar</button></div><div id="list"></div>`,
weights:()=>`<div class="row between"><h2>Pesajes</h2><button onclick="weightForm()">+ Pesaje</button></div><div id="list"></div>`,
feed:()=>`<div class="row between"><h2>Alimentación</h2><button onclick="feedForm()">+ Registro</button></div><div id="list"></div>`,
vet:()=>`<div class="row between"><h2>Veterinaria</h2><button onclick="vetForm()">+ Registro</button></div><div id="list"></div>`,
finance:()=>`<h2>Finanzas</h2><div class="grid">${stat('Ingresos',money(totalIncome()))}${stat('Gastos',money(totalExpenses()))}${stat('Compra de animales',money(totalPurchase()))}${stat('Ganancia neta',`<span class="${profit()>=0?'ok':'loss'}">${money(profit())}</span>`)}</div>
<div class="card"><div class="row"><button onclick="incomeForm()">+ Ingreso</button><button onclick="expenseForm()">+ Gasto</button></div></div><div id="list"></div>`,
sales:()=>`<div class="row between"><h2>Ventas</h2><button onclick="saleForm()">+ Venta</button></div><div class="card"><b>Ventas acumuladas:</b> ${money(totalSales())}</div><div id="list"></div>`,
reports:()=>`<h2>Reportes</h2><div class="grid">${stat('Inversión en compras',money(totalPurchase()))}${stat('Ventas',money(totalSales()))}${stat('Gastos operativos',money(totalExpenses()))}${stat('Ganancia neta',`<span class="${profit()>=0?'ok':'loss'}">${money(profit())}</span>`)}</div>
<div class="card"><h3>Recuperación de inversión</h3><div class="kpi">${money(totalSales())} / ${money(totalPurchase())}</div><p>${recovered()?'La inversión de compra está recuperada.':'Pendiente: '+money(Math.max(0,totalPurchase()-totalSales()))}</p>
<p class="muted">La ganancia neta = ventas + otros ingresos − gastos − compras de animales.</p></div>
<div class="card"><h3>Producción</h3><p>Crías registradas: <b>${data.offspring.length}</b></p><p>Servicios registrados: <b>${data.reproduction.length}</b></p></div>`,
backup:()=>`<h2>Respaldo</h2><div class="card"><p>Exporta todos tus registros a un archivo para conservarlos o moverlos a otro celular.</p><div class="row"><button onclick="backup()">💾 Exportar respaldo</button><button class="alt" onclick="document.getElementById('restoreFile').click()">📥 Importar respaldo</button></div><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></div>
<div class="card"><h3>Datos</h3><p>Animales: ${data.animals.length} · Crías: ${data.offspring.length} · Ventas: ${data.sales.length} · Gastos: ${data.finance.filter(x=>x.type==='Gasto').length}</p>
<button class="danger" onclick="clearAll()">⚠️ Borrar todos los datos</button></div>`
};

function render(){nav();$('app').innerHTML=V[tab]();after();if(tab==='indicators'){fillIndicatorAnimal();calcBreakEven();}}
function after(){
 if(!['animals','reproduction','offspring','weights','feed','vet','finance','sales'].includes(tab))return;
 const L=$('list'); if(!L)return;
 if(tab==='animals')L.innerHTML=data.animals.map(a=>`<div class="card"><b>${esc(a.tag)}</b> ${esc(a.name)}<br><span class="badge">${esc(a.sex)} · ${esc(a.breed)} · ${esc(a.status)}</span>
 <p>Peso inicial: ${a.weight||0} kg · Compra: ${money(a.purchase)}</p><div class="row"><button class="gray" onclick="detail('${a.id}')">Ficha</button><button class="danger" onclick="del('animals','${a.id}')">Eliminar</button></div></div>`).join('')||emptyMsg('No hay animales registrados.');
 if(tab==='reproduction')L.innerHTML=data.reproduction.map(x=>`<div class="card"><b>${esc(tag(x.female))}</b> × <b>${esc(tag(x.male))}</b><br>Servicio: ${x.date} · ${esc(x.result)} · Parto probable: ${x.expected||'-'}<br>Crías: ${x.count||0} <button class="danger" onclick="del('reproduction','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay servicios.');
 if(tab==='offspring')L.innerHTML=data.offspring.map(x=>`<div class="card"><b>${esc(x.tag)}</b> · ${esc(x.sex)} · ${x.weight||0} kg · ${x.date}<br>Madre: ${esc(tag(x.mother))} · Padre: ${esc(tag(x.father))}<button class="danger" onclick="del('offspring','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay crías.');
 if(tab==='weights')L.innerHTML=data.weights.map(x=>`<div class="card"><b>${esc(tag(x.animal))}</b> · ${x.date} · <b>${x.weight} kg</b><br>Alimento: ${x.feed||0} kg/día <button class="danger" onclick="del('weights','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay pesajes.');
 if(tab==='feed')L.innerHTML=data.feed.map(x=>`<div class="card">${x.date} · <b>${esc(x.type)}</b> · ${x.qty} kg · Costo ${money(x.cost)} <button class="danger" onclick="del('feed','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay registros de alimento.');
 if(tab==='vet')L.innerHTML=data.vet.map(x=>`<div class="card"><b>${esc(x.type)}</b> · ${x.date} · ${esc(tag(x.animal))}<br>${esc(x.med)} · ${esc(x.dose)} · ${esc(x.route)} · ${money(x.cost)} <button class="danger" onclick="del('vet','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay registros veterinarios.');
 if(tab==='finance')L.innerHTML=data.finance.map(x=>`<div class="card"><b>${x.type}</b> · ${x.date} · ${esc(x.category)} · ${money(x.amount)}<br>${esc(x.note)} <button class="danger" onclick="del('finance','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay movimientos.');
 if(tab==='sales')L.innerHTML=data.sales.map(x=>`<div class="card"><b>${esc(tag(x.animal))}</b> · ${x.date}<br>${x.weight} kg × ${money(x.price)}/kg = <b>${money(x.total)}</b><br>Comprador: ${esc(x.buyer||'-')} <button class="danger" onclick="del('sales','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay ventas.');
}
function emptyMsg(t){return `<div class="card empty">${t}</div>`}
function tag(id){return data.animals.find(a=>a.id===id)?.tag||'-'}
function modal(title,body){$('mt').textContent=title;$('mb').innerHTML=body;$('modal').classList.add('show')}
function closeM(){$('modal').classList.remove('show')}
function del(t,id){if(!confirm('¿Eliminar este registro?'))return;data[t]=data[t].filter(x=>x.id!==id);save();render()}

function fillIndicatorAnimal(){
  const id=$('indAnimal')?.value;if(!id)return;
  const a=data.animals.find(x=>x.id===id);if(!a)return;
  const ws=data.weights.filter(x=>x.animal===id).sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  $('indWi').value=ws.length?Number(a.weight||0):Number(a.weight||0);
  $('indDi').value=a.entry||ws[0]?.date||'';
  if(ws.length){const last=ws[ws.length-1];$('indWf').value=Number(last.weight||0);$('indDf').value=last.date||'';}
  else {$('indWf').value=Number(a.weight||0);$('indDf').value=a.entry||'';}
  calcIndicators();
}
function calcIndicators(){
  const wi=Number($('indWi')?.value)||0,wf=Number($('indWf')?.value)||0,feed=Number($('indFeed')?.value)||0;
  const di=$('indDi')?.value,df=$('indDf')?.value;
  let days=0;if(di&&df){const a=new Date(di+'T00:00:00'),b=new Date(df+'T00:00:00');days=Math.max(0,Math.round((b-a)/86400000));}
  const gain=wf-wi,gdp=days>0?gain/days:0,fcr=gain>0?feed/gain:null;
  if($('indGain'))$('indGain').textContent=gain.toFixed(2)+' kg';
  if($('indDays'))$('indDays').textContent=String(days);
  if($('indGdp'))$('indGdp').textContent=gdp.toFixed(3)+' kg/día';
  if($('indFcr'))$('indFcr').textContent=fcr===null?'—':fcr.toFixed(2)+' kg/kg';
}
function calcBreakEven(){
  const fixed=Number($('beFixed')?.value)||0,price=Number($('bePrice')?.value)||0,v=Number($('beVar')?.value)||0,margin=price-v;
  if(margin<=0){if($('beKg'))$('beKg').textContent='— kg';if($('beMoney'))$('beMoney').textContent='—';if($('beMsg'))$('beMsg').textContent='El precio de venta por kg debe ser mayor que el costo variable por kg.';return;}
  const kg=fixed/margin;
  if($('beKg'))$('beKg').textContent=kg.toFixed(2)+' kg';
  if($('beMoney'))$('beMoney').textContent=money(kg*price);
  if($('beMsg'))$('beMsg').textContent='Necesitas vender aproximadamente '+kg.toFixed(2)+' kg para cubrir los costos fijos bajo estos supuestos.';
}
function animalForm(){modal('Registrar animal',`<form onsubmit="event.preventDefault();let o={id:uid(),tag:a.value.trim(),name:n.value.trim(),sex:s.value,breed:r.value.trim(),birth:d.value,entry:i.value,weight:+w.value||0,purchase:+p.value||0,status:st.value,notes:no.value};if(!o.tag)return alert('El arete es obligatorio.');data.animals.push(o);save();closeM();render()">
<div class="two"><div><label>Arete *</label><input id=a required></div><div><label>Nombre</label><input id=n></div><div><label>Sexo</label><select id=s><option>Hembra</option><option>Macho</option></select></div><div><label>Raza</label><input id=r value="Dorper"></div><div><label>Fecha nacimiento</label><input id=d type=date></div><div><label>Fecha ingreso</label><input id=i type=date value="${today()}"></div><div><label>Peso inicial kg</label><input id=w type=number step=.01 min=0></div><div><label>Precio de compra $</label><input id=p type=number step=.01 min=0></div></div><label>Estado</label><select id=st><option>Activo</option><option>Vendido</option><option>Muerto</option><option>Baja</option></select><label>Notas</label><textarea id=no></textarea><button>Guardar animal</button></form>`)}

function weightForm(){if(!data.animals.length)return alert('Primero registra un animal.');modal('Nuevo pesaje',`<form onsubmit="event.preventDefault();data.weights.push({id:uid(),animal:a.value,date:d.value,weight:+w.value,feed:+f.value||0});save();closeM();render()"><label>Animal</label><select id=a required>${animalOpts()}</select><label>Fecha</label><input id=d type=date value="${today()}" required><label>Peso kg</label><input id=w type=number step=.01 min=0 required><label>Alimento kg/día</label><input id=f type=number step=.01 min=0><button>Guardar pesaje</button></form>`)}

function reproForm(){let f=data.animals.filter(a=>a.sex==='Hembra'),m=data.animals.filter(a=>a.sex==='Macho');if(!f.length||!m.length)return alert('Necesitas al menos una hembra y un macho.');modal('Registrar servicio',`<form onsubmit="event.preventDefault();data.reproduction.push({id:uid(),female:f.value,male:m.value,date:d.value,result:g.value,expected:e.value,count:+c.value||0,note:n.value});save();closeM();render()"><label>Hembra</label><select id=f>${animalOpts(a=>a.sex==='Hembra')}</select><label>Macho</label><select id=m>${animalOpts(a=>a.sex==='Macho')}</select><label>Fecha del servicio</label><input id=d type=date value="${today()}" required><label>Resultado</label><select id=g><option>Pendiente</option><option>Gestante</option><option>No gestante</option></select><label>Parto probable</label><input id=e type=date><label>Número de crías</label><input id=c type=number min=0><label>Notas</label><textarea id=n></textarea><button>Guardar servicio</button></form>`)}

function criaForm(){let f=data.animals.filter(a=>a.sex==='Hembra'),m=data.animals.filter(a=>a.sex==='Macho');if(!f.length||!m.length)return alert('Necesitas registrar madre y padre.');modal('Registrar cría',`<form onsubmit="event.preventDefault();let o={id:uid(),tag:a.value.trim(),sex:s.value,date:d.value,weight:+w.value||0,mother:f.value,father:m.value};if(!o.tag)return alert('El arete es obligatorio.');data.offspring.push(o);save();closeM();render()"><label>Arete *</label><input id=a required><label>Sexo</label><select id=s><option>Hembra</option><option>Macho</option></select><label>Fecha nacimiento</label><input id=d type=date value="${today()}" required><label>Peso nacimiento kg</label><input id=w type=number step=.01 min=0 required><label>Madre</label><select id=f>${animalOpts(a=>a.sex==='Hembra')}</select><label>Padre</label><select id=m>${animalOpts(a=>a.sex==='Macho')}</select><button>Guardar cría</button></form>`)}

function feedForm(){modal('Registrar alimento',`<form id="feedForm"><label>Fecha</label><input id="feedDate" type="date" value="${today()}" required><label>Alimento</label><input id="feedType" required><label>Cantidad kg</label><input id="feedQty" type="number" step=".01" min="0.01" required><label>Precio por kg $</label><input id="feedPrice" type="number" step=".01" min="0" value="0"><label>Costo total</label><input id="feedTotal" type="number" step=".01" min="0" value="0" readonly><label>Notas</label><input id="feedNote"><button type="submit">Guardar alimento</button></form>`);$('feedQty').addEventListener('input',calcFeedTotal);$('feedPrice').addEventListener('input',calcFeedTotal);$('feedForm').addEventListener('submit',saveFeed);calcFeedTotal();}
function calcFeedTotal(){let q=Number($('feedQty').value)||0,p=Number($('feedPrice').value)||0;$('feedTotal').value=(q*p).toFixed(2);}
function saveFeed(e){e.preventDefault();let q=Number($('feedQty').value)||0,p=Number($('feedPrice').value)||0;if(q<=0)return alert('La cantidad debe ser mayor que 0.');let o={id:uid(),date:$('feedDate').value,type:$('feedType').value.trim(),qty:q,cost:q*p,note:$('feedNote').value.trim()};if(!o.type)return alert('Escribe el tipo de alimento.');data.feed.push(o);save();closeM();render();alert('Alimento registrado correctamente.');}

function vetForm(){if(!data.animals.length)return alert('Primero registra un animal.');modal('Registro veterinario',`<form onsubmit="event.preventDefault();data.vet.push({id:uid(),animal:a.value,date:d.value,type:t.value,med:m.value,dose:o.value,route:v.value,cost:+c.value||0,note:n.value});save();closeM();render()"><label>Animal</label><select id=a>${animalOpts()}</select><label>Fecha</label><input id=d type=date value="${today()}"><label>Tipo</label><select id=t><option>Vacuna</option><option>Desparasitación</option><option>Enfermedad</option><option>Tratamiento</option><option>Otro</option></select><label>Medicamento</label><input id=m><label>Dosis</label><input id=o><label>Vía</label><input id=v placeholder="SC, IM, VO..."><label>Costo $</label><input id=c type=number step=.01 min=0><label>Notas</label><input id=n><button>Guardar registro</button></form>`)}

function incomeForm(){modal('Registrar ingreso',`<form onsubmit="event.preventDefault();data.finance.push({id:uid(),type:'Ingreso',date:d.value,category:c.value,amount:+a.value||0,note:n.value});save();closeM();render()"><label>Fecha</label><input id=d type=date value="${today()}"><label>Categoría</label><input id=c placeholder="Ej. venta de estiércol" required><label>Monto $</label><input id=a type=number step=.01 min=0 required><label>Nota</label><input id=n><button>Guardar ingreso</button></form>`)}
function expenseForm(){modal('Registrar gasto',`<form onsubmit="event.preventDefault();data.finance.push({id:uid(),type:'Gasto',date:d.value,category:c.value,amount:+a.value||0,note:n.value});save();closeM();render()"><label>Fecha</label><input id=d type=date value="${today()}"><label>Categoría</label><input id=c placeholder="Ej. transporte" required><label>Monto $</label><input id=a type=number step=.01 min=0 required><label>Nota</label><input id=n><button>Guardar gasto</button></form>`)}
function saleForm(){let a=activeAnimals();if(!a.length)return alert('No hay animales activos para vender.');modal('Registrar venta',`<form onsubmit="event.preventDefault();let wt=+w.value||0,pr=+p.value||0;data.sales.push({id:uid(),animal:a.value,date:d.value,weight:wt,price:pr,total:wt*pr,buyer:b.value,note:n.value});let an=data.animals.find(x=>x.id===a.value);if(an)an.status='Vendido';save();closeM();render()"><label>Animal</label><select id=a>${animalOpts(x=>x.status==='Activo')}</select><label>Fecha</label><input id=d type=date value="${today()}"><label>Peso vendido kg</label><input id=w type=number step=.01 min=0 required><label>Precio por kg $</label><input id=p type=number step=.01 min=0 required><label>Comprador</label><input id=b><label>Notas</label><input id=n><button>Guardar venta</button></form>`)}

function detail(id){let a=data.animals.find(x=>x.id===id);let ws=data.weights.filter(x=>x.animal===id);modal('Ficha · '+esc(a.tag),`<p><b>${esc(a.name)}</b> · ${esc(a.sex)} · ${esc(a.breed)}</p><p>Peso inicial: ${a.weight||0} kg · Compra: ${money(a.purchase)}</p><h3>Pesajes</h3>${ws.map(w=>`<p>${w.date}: <b>${w.weight} kg</b></p>`).join('')||'<p>Sin pesajes.</p>'}<p>${esc(a.notes||'')}</p>`)}
function backup(){let blob=new Blob([JSON.stringify({version:3,exported_at:new Date().toISOString(),data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gestion_pecuaria_respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data||!x.data.animals)throw Error('Formato no válido');data=Object.assign(empty(),x.data);save();alert('Respaldo restaurado correctamente.');render()}catch(e){alert('No se pudo importar el respaldo.')}};r.readAsText(file)}
function clearAll(){if(confirm('Esto borrará TODOS los datos de este dispositivo. ¿Continuar?')){data=empty();save();render()}}
window.addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
render();
</script>
</body></html>

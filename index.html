<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17452f"><title>Gestión Pecuaria</title>
<style>
:root{--g:#17452f;--g2:#236846;--bg:#f3f6f3;--card:#fff;--line:#dbe5de;--text:#172019;--muted:#68756d;--red:#a62e28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:14px 16px;box-shadow:0 2px 8px #0002}header b{font-size:20px}header small{opacity:.85}nav{position:sticky;top:67px;z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow:auto}nav button{flex:0 0 auto;background:#fff;color:var(--text);border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 13px;font-weight:700}nav button.on{color:var(--g);border-bottom-color:var(--g)}main{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}button{background:var(--g);color:#fff;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}button.alt{background:#e7eee9;color:var(--g)}button.danger{background:#f6e2e0;color:var(--red)}button.gray{background:#eef1ef;color:#34413a}input,select,textarea{width:100%;padding:10px;margin:4px 0 9px;border:1px solid #ccd6ce;border-radius:9px;font:inherit;background:#fff}textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:16px;overflow:auto}.modal.show{display:block}.box{max-width:720px;margin:30px auto;background:#fff;border-radius:16px;padding:16px}.badge{display:inline-block;background:#e8f0ea;color:var(--g);padding:3px 8px;border-radius:20px;font-size:11px}.muted{color:var(--muted);font-size:13px}.empty{padding:18px;text-align:center;color:var(--muted)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.kpi{font-size:28px;font-weight:800}.ok{color:#176b3b}.loss{color:var(--red)}.notice{background:#eef7f0;border:1px solid #cfe4d4;color:#24583a;padding:12px;border-radius:10px;margin-bottom:12px}.formula{background:#f8faf8;border-left:4px solid var(--g);padding:10px;margin:8px 0;border-radius:6px}.formula b{display:block}.pill{font-size:12px;padding:4px 8px;border-radius:20px;background:#e7eee9;color:var(--g)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><b>🐑 Gestión Pecuaria</b><br><small id="status">Guardado en este dispositivo</small></header>
<nav id="nav"></nav><main id="app"></main>
<div id="modal" class="modal"><div class="box"><div class="row between"><h2 id="mt"></h2><button class="alt" onclick="closeM()">✕</button></div><div id="mb"></div></div></div>
<script>
const KEY='gestion_pecuaria_v3';
const tabs=[['home','🏠 Inicio'],['animals','🐏 Animales'],['reproduction','❤️ Repro'],['offspring','🍼 Crías'],['weights','⚖️ Pesajes'],['feed','🌾 Alimento'],['vet','🩺 Veterinaria'],['finance','💰 Finanzas'],['sales','🛒 Ventas'],['reports','📊 Reportes'],['indicators','📐 Indicadores'],['backup','💾 Respaldo']];
const empty=()=>({animals:[],reproduction:[],offspring:[],weights:[],feed:[],vet:[],finance:[],sales:[]});
let data=loadData(),tab='home';
function loadData(){try{return Object.assign(empty(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return empty()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='✓ Guardado automáticamente en este dispositivo'}
function $(id){return document.getElementById(id)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function today(){return new Date().toISOString().slice(0,10)}function n(v){return Number(v)||0}function money(v){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n(v))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(){$('nav').innerHTML=tabs.map(([id,t])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')">${t}</button>`).join('')}function go(x){tab=x;render()}function stat(a,b){return `<div class="card stat"><small>${a}</small><strong>${b}</strong></div>`}function activeAnimals(){return data.animals.filter(a=>a.status==='Activo'||!a.status)}function totalPurchase(){return data.animals.reduce((s,a)=>s+n(a.purchase),0)}function totalFeedCost(){return data.feed.reduce((s,x)=>s+n(x.cost),0)}function totalVetCost(){return data.vet.reduce((s,x)=>s+n(x.cost),0)}function totalExpenses(){return data.finance.filter(x=>x.type==='Gasto').reduce((s,x)=>s+n(x.amount),0)+totalFeedCost()+totalVetCost()}function totalSales(){return data.sales.reduce((s,x)=>s+n(x.total),0)}function totalIncome(){return totalSales()+data.finance.filter(x=>x.type==='Ingreso').reduce((s,x)=>s+n(x.amount),0)}function profit(){return totalIncome()-totalExpenses()-totalPurchase()}function tag(id){let a=data.animals.find(x=>x.id===id);return a?a.tag||a.name||id:id||'-'}function animalOpts(){return data.animals.map(a=>`<option value="${a.id}">${esc(a.tag||a.name||'Animal')} · ${esc(a.breed||'')}</option>`).join('')}
function daysBetween(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000))}
function weightSeries(id){return data.weights.filter(x=>x.animal===id).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function animalGain(id){let w=weightSeries(id);if(w.length<2)return null;let first=w[0],last=w[w.length-1],days=daysBetween(first.date,last.date),gain=n(last.weight)-n(first.weight);return {first,last,days,gain,daily:days?gain/days:0}}
function animalFeedKg(id){return data.feed.filter(x=>!x.animal||x.animal===id).reduce((s,x)=>s+n(x.qty),0)}
function conversion(id){let g=animalGain(id),feed=animalFeedKg(id);return g&&g.gain>0?feed/g.gain:null}
function costFixed(){return data.finance.filter(x=>x.type==='Gasto'&&x.fixed).reduce((s,x)=>s+n(x.amount),0)}
function costVariable(){let v=data.finance.filter(x=>x.type==='Gasto'&&!x.fixed).reduce((s,x)=>s+n(x.amount),0)+totalFeedCost()+totalVetCost();return v}
function soldKg(){return data.sales.reduce((s,x)=>s+n(x.kg),0)}
function salePriceKg(){let kg=soldKg(),v=totalSales();return kg?v/kg:0}
function variablePerKg(){let kg=soldKg();return kg?costVariable()/kg:0}
function breakEven(){let margin=salePriceKg()-variablePerKg();return margin>0?costFixed()/margin:null}
function emptyMsg(x){return `<div class="card empty">${x}</div>`}

const V={
home:()=>`<h2>Dashboard</h2><div class="grid">${stat('Animales activos',activeAnimals().length)}${stat('Hembras',activeAnimals().filter(a=>a.sex==='Hembra').length)}${stat('Machos',activeAnimals().filter(a=>a.sex==='Macho').length)}${stat('Crías',data.offspring.length)}${stat('Ventas',money(totalSales()))}${stat('Gastos',money(totalExpenses()))}${stat('Inversión compra',money(totalPurchase()))}${stat('Ganancia neta',`<span class="${profit()>=0?'ok':'loss'}">${money(profit())}</span>`)}</div><div class="notice"><b>${totalSales()>=totalPurchase()?'✓ Inversión recuperada':'⏳ Inversión pendiente'}</b><br>Ventas: ${money(totalSales())} · Compras: ${money(totalPurchase())}</div><div class="card"><h3>Acciones rápidas</h3><div class="row"><button onclick="animalForm()">+ Animal</button><button onclick="weightForm()">⚖️ Pesaje</button><button onclick="feedForm()">🌾 Alimento</button><button onclick="saleForm()">🛒 Venta</button><button onclick="expenseForm()">💸 Gasto</button></div></div>`,
animals:()=>`<div class="row between"><h2>Animales</h2><button onclick="animalForm()">+ Registrar</button></div><div id="list"></div>`,
reproduction:()=>`<div class="row between"><h2>Reproducción</h2><button onclick="reproForm()">+ Servicio</button></div><div id="list"></div>`,
offspring:()=>`<div class="row between"><h2>Crías</h2><button onclick="criaForm()">+ Registrar</button></div><div id="list"></div>`,
weights:()=>`<div class="row between"><h2>Pesajes</h2><button onclick="weightForm()">+ Pesaje</button></div><div id="list"></div>`,
feed:()=>`<div class="row between"><h2>Alimentación</h2><button onclick="feedForm()">+ Registro</button></div><div id="list"></div>`,
vet:()=>`<div class="row between"><h2>Veterinaria</h2><button onclick="vetForm()">+ Registro</button></div><div id="list"></div>`,
finance:()=>`<h2>Finanzas</h2><div class="grid">${stat('Ingresos',money(totalIncome()))}${stat('Gastos',money(totalExpenses()))}${stat('Compras',money(totalPurchase()))}${stat('Ganancia neta',`<span class="${profit()>=0?'ok':'loss'}">${money(profit())}</span>`)}</div><div class="card"><button onclick="incomeForm()">+ Ingreso</button> <button onclick="expenseForm()">+ Gasto</button></div><div id="list"></div>`,
sales:()=>`<div class="row between"><h2>Ventas</h2><button onclick="saleForm()">+ Venta</button></div><div class="card"><b>Ventas acumuladas:</b> ${money(totalSales())}</div><div id="list"></div>`,
reports:()=>`<h2>Reportes</h2><div class="grid">${stat('Inversión',money(totalPurchase()))}${stat('Ventas',money(totalSales()))}${stat('Costos',money(totalExpenses()))}${stat('Utilidad',money(profit()))}</div><div class="card"><h3>Recuperación</h3><div class="kpi">${money(totalSales())} / ${money(totalPurchase())}</div><p>${totalSales()>=totalPurchase()?'Inversión recuperada':'Pendiente: '+money(Math.max(0,totalPurchase()-totalSales()))}</p></div>`,
indicators:()=>`<h2>Indicadores productivos y económicos</h2><div class="notice"><b>Los indicadores se calculan automáticamente con los registros de animales, pesajes, alimento, ventas y gastos.</b><br>Si todavía no hay datos suficientes, aparecerá “Sin datos” en lugar de inventar resultados.</div><div class="grid">${stat('Utilidad',money(profit()))}${stat('Rentabilidad',profit()/Math.max(1,totalExpenses())*100+' %')}${stat('Margen de utilidad',profit()/Math.max(1,totalIncome())*100+' %')}${stat('Punto de equilibrio',breakEven()===null?'Sin datos':breakEven().toFixed(2)+' kg')}</div><div class="card"><h3>📈 Indicadores de crecimiento y alimentación</h3><div id="indicatorTable"></div></div><div class="card"><h3>💰 Indicadores económicos</h3><div class="two"><div class="formula"><b>Utilidad</b>Ingresos totales − Costos totales<br><strong>${money(profit())}</strong></div><div class="formula"><b>Rentabilidad</b>Utilidad ÷ Costos totales × 100<br><strong>${(profit()/Math.max(1,totalExpenses())*100).toFixed(2)} %</strong></div><div class="formula"><b>Margen de utilidad</b>Utilidad ÷ Ingresos totales × 100<br><strong>${(profit()/Math.max(1,totalIncome())*100).toFixed(2)} %</strong></div><div class="formula"><b>Punto de equilibrio</b>Costos fijos ÷ (Precio de venta/kg − Costos variables/kg)<br><strong>${breakEven()===null?'Sin datos suficientes':breakEven().toFixed(2)+' kg'}</strong></div></div></div><div class="card"><h3>📊 Datos usados</h3><p>Costos totales: <b>${money(totalExpenses())}</b></p><p>Ingresos totales: <b>${money(totalIncome())}</b></p><p>Costos fijos registrados: <b>${money(costFixed())}</b></p><p>Costos variables registrados: <b>${money(costVariable())}</b></p><p>Precio promedio de venta: <b>${salePriceKg()?money(salePriceKg())+'/kg':'Sin datos'}</b></p><p>Kg vendidos: <b>${soldKg().toFixed(2)}</b></p></div>`,
backup:()=>`<h2>Respaldo</h2><div class="card"><p>Exporta todos tus registros a un archivo JSON.</p><button onclick="backup()">💾 Exportar respaldo</button> <button class="alt" onclick="$('restoreFile').click()">📥 Importar respaldo</button><input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restore(this)"></div><div class="card"><button class="danger" onclick="clearAll()">⚠️ Borrar todos los datos</button></div>`};

function render(){nav();let view=V[tab];$('app').innerHTML=view?view():emptyMsg('Sección no disponible');after();if(tab==='indicators')renderIndicators()}
function after(){if(!['animals','reproduction','offspring','weights','feed','vet','finance','sales'].includes(tab))return;let L=$('list');if(!L)return;if(tab==='animals')L.innerHTML=data.animals.map(a=>`<div class="card"><b>${esc(a.tag||a.name)}</b> · ${esc(a.sex||'')}<br><span class="badge">${esc(a.breed||'')} · ${esc(a.status||'Activo')}</span><p>Peso inicial: ${n(a.weight)} kg · Compra: ${money(a.purchase)}</p><button class="danger" onclick="del('animals','${a.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay animales registrados.');if(tab==='reproduction')L.innerHTML=data.reproduction.map(x=>`<div class="card"><b>${esc(tag(x.female))}</b> × <b>${esc(tag(x.male))}</b><br>${x.date||''} · ${esc(x.result||'')} · Crías: ${x.count||0}<button class="danger" onclick="del('reproduction','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay servicios.');if(tab==='offspring')L.innerHTML=data.offspring.map(x=>`<div class="card"><b>${esc(x.tag)}</b> · ${esc(x.sex)} · ${n(x.weight)} kg · ${x.date||''}<br>Madre: ${esc(tag(x.mother))} · Padre: ${esc(tag(x.father))}<button class="danger" onclick="del('offspring','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay crías.');if(tab==='weights')L.innerHTML=data.weights.map(x=>`<div class="card"><b>${esc(tag(x.animal))}</b> · ${x.date||''} · <b>${n(x.weight)} kg</b><br>Alimento: ${n(x.feed)} kg/día <button class="danger" onclick="del('weights','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay pesajes.');if(tab==='feed')L.innerHTML=data.feed.map(x=>`<div class="card">${x.date||''} · <b>${esc(x.type||'Alimento')}</b> · ${n(x.qty)} kg · Costo ${money(x.cost)}${x.animal?' · '+esc(tag(x.animal)):''}<button class="danger" onclick="del('feed','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay registros de alimento.');if(tab==='vet')L.innerHTML=data.vet.map(x=>`<div class="card"><b>${esc(x.type||'Consulta')}</b> · ${x.date||''} · ${esc(tag(x.animal))}<br>${esc(x.med||'')} · ${esc(x.dose||'')} · ${money(x.cost)} <button class="danger" onclick="del('vet','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay registros veterinarios.');if(tab==='finance')L.innerHTML=data.finance.map(x=>`<div class="card"><b>${esc(x.type)}</b> · ${x.date||''} · ${money(x.amount)}${x.fixed?' · Fijo':''}<br>${esc(x.desc||'')} <button class="danger" onclick="del('finance','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay movimientos.');if(tab==='sales')L.innerHTML=data.sales.map(x=>`<div class="card"><b>${x.date||''}</b> · ${n(x.kg)} kg · ${money(x.total)}<br>${esc(x.desc||'')} <button class="danger" onclick="del('sales','${x.id}')">Eliminar</button></div>`).join('')||emptyMsg('No hay ventas.')}
function renderIndicators(){let L=$('indicatorTable');if(!L)return;let rows=data.animals.map(a=>{let g=animalGain(a.id),c=conversion(a.id);return `<tr><td>${esc(a.tag||a.name)}</td><td>${g?g.first.weight.toFixed(2):'Sin datos'}</td><td>${g?g.last.weight.toFixed(2):'Sin datos'}</td><td>${g?g.days:'Sin datos'}</td><td>${g?g.gain.toFixed(2):'Sin datos'}</td><td>${g?g.daily.toFixed(3):'Sin datos'}</td><td>${animalFeedKg(a.id)?animalFeedKg(a.id).toFixed(2):'Sin datos'}</td><td>${c?c.toFixed(2):'Sin datos'}</td></tr>`}).join('');L.innerHTML=rows?`<div class="tablewrap"><table class="table"><tr><th>Animal</th><th>Peso inicial</th><th>Peso final</th><th>Días</th><th>Ganancia</th><th>GDP kg/día</th><th>Alimento kg</th><th>Conversión</th></tr>${rows}</table></div>`:emptyMsg('Registra al menos dos pesajes y consumo de alimento para calcular los indicadores.')}
function openM(t,html){$('mt').textContent=t;$('mb').innerHTML=html;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}
function animalForm(){openM('Registrar animal',`<div class="two"><div><label>Arete/ID</label><input id="f_tag"></div><div><label>Nombre</label><input id="f_name"></div></div><div class="two"><div><label>Sexo</label><select id="f_sex"><option>Hembra</option><option>Macho</option></select></div><div><label>Raza</label><input id="f_breed"></div></div><div class="two"><div><label>Peso inicial (kg)</label><input id="f_weight" type="number" step="0.01"></div><div><label>Costo de compra ($)</label><input id="f_purchase" type="number" step="0.01"></div></div><button onclick="addAnimal()">Guardar</button>`)}
function addAnimal(){data.animals.push({id:uid(),tag:$('f_tag').value,name:$('f_name').value,sex:$('f_sex').value,breed:$('f_breed').value,weight:n($('f_weight').value),purchase:n($('f_purchase').value),status:'Activo'});save();closeM();render()}
function weightForm(){openM('Registrar pesaje',`<label>Animal</label><select id="f_animal">${animalOpts()}</select><label>Fecha</label><input id="f_date" type="date" value="${today()}"><label>Peso (kg)</label><input id="f_w" type="number" step="0.01"><label>Alimento consumido ese registro (kg)</label><input id="f_feed" type="number" step="0.01"><button onclick="addWeight()">Guardar</button>`)}
function addWeight(){data.weights.push({id:uid(),animal:$('f_animal').value,date:$('f_date').value,weight:n($('f_w').value),feed:n($('f_feed').value)});save();closeM();render()}
function feedForm(){openM('Registrar alimento',`<label>Animal (opcional)</label><select id="f_animal"><option value="">Lote/general</option>${animalOpts()}</select><label>Tipo de alimento</label><input id="f_type"><div class="two"><div><label>Cantidad (kg)</label><input id="f_qty" type="number" step="0.01"></div><div><label>Costo total ($)</label><input id="f_cost" type="number" step="0.01"></div></div><label>Fecha</label><input id="f_date" type="date" value="${today()}"><button onclick="addFeed()">Guardar</button>`)}
function addFeed(){data.feed.push({id:uid(),animal:$('f_animal').value,type:$('f_type').value,qty:n($('f_qty').value),cost:n($('f_cost').value),date:$('f_date').value});save();closeM();render()}
function expenseForm(){openM('Registrar gasto',`<label>Descripción</label><input id="f_desc"><div class="two"><div><label>Monto ($)</label><input id="f_amount" type="number" step="0.01"></div><div><label>Fecha</label><input id="f_date" type="date" value="${today()}"></div></div><label><input id="f_fixed" type="checkbox" style="width:auto"> Costo fijo</label><button onclick="addFinance('Gasto')">Guardar</button>`)}function incomeForm(){openM('Registrar ingreso',`<label>Descripción</label><input id="f_desc"><label>Monto ($)</label><input id="f_amount" type="number" step="0.01"><label>Fecha</label><input id="f_date" type="date" value="${today()}"><button onclick="addFinance('Ingreso')">Guardar</button>`)}function addFinance(type){data.finance.push({id:uid(),type,desc:$('f_desc').value,amount:n($('f_amount').value),date:$('f_date').value,fixed:type==='Gasto'&&$('f_fixed')?$('f_fixed').checked:false});save();closeM();render()}
function saleForm(){openM('Registrar venta',`<label>Fecha</label><input id="f_date" type="date" value="${today()}"><div class="two"><div><label>Kilogramos vendidos</label><input id="f_kg" type="number" step="0.01"></div><div><label>Total de venta ($)</label><input id="f_total" type="number" step="0.01"></div></div><label>Descripción</label><input id="f_desc"><button onclick="addSale()">Guardar</button>`)}function addSale(){data.sales.push({id:uid(),date:$('f_date').value,kg:n($('f_kg').value),total:n($('f_total').value),desc:$('f_desc').value});save();closeM();render()}
function reproForm(){openM('Registrar servicio',`<div class="two"><div><label>Hembra</label><select id="f_female">${animalOpts()}</select></div><div><label>Macho</label><select id="f_male">${animalOpts()}</select></div></div><label>Fecha</label><input id="f_date" type="date" value="${today()}"><label>Resultado</label><select id="f_result"><option>Servida</option><option>Gestante</option><option>Vacía</option><option>Parto</option></select><label>Crías</label><input id="f_count" type="number"><button onclick="addRepro()">Guardar</button>`)}function addRepro(){data.reproduction.push({id:uid(),female:$('f_female').value,male:$('f_male').value,date:$('f_date').value,result:$('f_result').value,count:n($('f_count').value)});save();closeM();render()}
function criaForm(){openM('Registrar cría',`<label>Identificación</label><input id="f_tag"><div class="two"><div><label>Madre</label><select id="f_mother">${animalOpts()}</select></div><div><label>Padre</label><select id="f_father">${animalOpts()}</select></div></div><div class="two"><div><label>Sexo</label><select id="f_sex"><option>Hembra</option><option>Macho</option></select></div><div><label>Peso (kg)</label><input id="f_weight" type="number" step="0.01"></div></div><label>Fecha</label><input id="f_date" type="date" value="${today()}"><button onclick="addCria()">Guardar</button>`)}function addCria(){data.offspring.push({id:uid(),tag:$('f_tag').value,mother:$('f_mother').value,father:$('f_father').value,sex:$('f_sex').value,weight:n($('f_weight').value),date:$('f_date').value});save();closeM();render()}
function vetForm(){openM('Registro veterinario',`<label>Animal</label><select id="f_animal">${animalOpts()}</select><label>Tipo</label><input id="f_type"><label>Medicamento/tratamiento</label><input id="f_med"><label>Dosis</label><input id="f_dose"><div class="two"><div><label>Costo ($)</label><input id="f_cost" type="number" step="0.01"></div><div><label>Fecha</label><input id="f_date" type="date" value="${today()}"></div></div><button onclick="addVet()">Guardar</button>`)}function addVet(){data.vet.push({id:uid(),animal:$('f_animal').value,type:$('f_type').value,med:$('f_med').value,dose:$('f_dose').value,cost:n($('f_cost').value),date:$('f_date').value});save();closeM();render()}
function del(type,id){if(!confirm('¿Eliminar registro?'))return;data[type]=data[type].filter(x=>x.id!==id);save();render()}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo_gestion_pecuaria.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=Object.assign(empty(),JSON.parse(r.result));save();render();alert('Respaldo importado correctamente.')}catch(e){alert('Archivo no válido.')}};r.readAsText(f)}function clearAll(){if(confirm('Esto borrará todos los registros de este dispositivo. ¿Continuar?')){data=empty();save();render()}}
render();
</script></body></html>

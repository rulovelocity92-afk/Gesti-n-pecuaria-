<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17452f"><title>Gestión Pecuaria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f3f6f3;color:#172019;font:15px system-ui}header{background:#17452f;color:#fff;padding:16px;position:sticky;top:0;z-index:5}nav{display:flex;overflow:auto;background:#fff;position:sticky;top:67px;z-index:4}nav button{white-space:nowrap;border:0;background:#fff;padding:12px;font-weight:700}.on{color:#17452f;border-bottom:3px solid #17452f}main{max-width:1050px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #dce5de;border-radius:14px;padding:14px;margin-bottom:12px}.stat strong{display:block;font-size:21px;margin-top:4px}button{background:#17452f;color:white;border:0;border-radius:9px;padding:10px 13px;font-weight:700}button.alt{background:#e7eee9;color:#17452f}button.danger{background:#f6e2e0;color:#a62e28}input,select,textarea{width:100%;padding:10px;margin:4px 0 9px;border:1px solid #ccd6ce;border-radius:9px;box-sizing:border-box;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:16px;overflow:auto}.modal.show{display:block}.box{max-width:650px;margin:30px auto;background:#fff;border-radius:16px;padding:16px}.login{position:fixed;inset:0;background:#f3f6f3;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{max-width:430px;width:100%;background:#fff;padding:20px;border-radius:18px}.muted{color:#69756d;font-size:12px}.badge{background:#e8f0ea;color:#17452f;padding:3px 8px;border-radius:20px;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style></head><body>
<header><b>🐑 Gestión Pecuaria</b><br><small id="status">☁️ Base de datos en la nube</small></header>
<nav id="nav"></nav><main id="app"></main>
<div id="modal" class="modal"><div class="box"><div class="row between"><h2 id="mt"></h2><button class="alt" onclick="closeM()">✕</button></div><div id="mb"></div></div></div>
<div id="login" class="login"><div class="loginbox"><h1>🐑 Gestión Pecuaria</h1><p class="muted">Inicia sesión para que tus registros queden guardados en Supabase.</p><form onsubmit="event.preventDefault();enter()"><label>Correo</label><input id="email" type="email" required><label>Contraseña</label><input id="pass" type="password" minlength="6" required><button>Entrar</button> <button type="button" class="alt" onclick="register()">Crear cuenta</button><p id="msg" class="muted"></p></form></div></div>
<script>
const URL='https://bhodqfgjmspmnuyfmgeh.supabase.co';
const KEY='sb_publishable_uOaRI0kFvjxv-yOOleh5Dg_yF3xU3Of';
const S=supabase.createClient(URL,KEY);
let user=null,tab='home',data={animals:[],weights:[],reproduction:[],offspring:[],feed_records:[],veterinary:[],money_movements:[],sales:[]};
const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
async function load(){for(let t in data){let r=await S.from(t).select('*').order('created_at',{ascending:false});if(r.error){alert('Error en '+t+': '+r.error.message);return false}data[t]=r.data||[]}return true}
async function add(t,o){o.user_id=user.id;let r=await S.from(t).insert(o);if(r.error){alert(r.error.message);return false}await load();render();return true}
async function del(t,id){if(!confirm('¿Eliminar este registro?'))return;let r=await S.from(t).delete().eq('id',id);if(r.error)alert(r.error.message);else{await load();render()}}
function go(x){tab=x;render()}function nav(){let a=[['home','🏠 Inicio'],['animals','🐏 Animales'],['reproduction','❤️ Repro'],['offspring','🍼 Crías'],['feed_records','🌾 Alimento'],['veterinary','🩺 Veterinaria'],['money_movements','💰 Finanzas'],['sales','🛒 Ventas'],['reports','📊 Reportes']];$('nav').innerHTML=a.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+'<button onclick="logout()">🚪 Salir</button>'}
function stat(a,b){return `<div class="card stat"><small>${a}</small><strong>${b}</strong></div>`}
function totalIn(){return data.money_movements.filter(x=>x.movement_type=='Ingreso').reduce((s,x)=>s+Number(x.amount),0)+data.sales.reduce((s,x)=>s+Number(x.total),0)}
function totalOut(){return data.money_movements.filter(x=>x.movement_type=='Gasto').reduce((s,x)=>s+Number(x.amount),0)}
function render(){nav();$('status').textContent='☁️ Guardado en la nube · '+user.email;$('app').innerHTML=V[tab]();after()}
const V={
home:()=>`<h2>Dashboard</h2><div class=grid>${stat('Animales activos',data.animals.filter(x=>x.status=='Activo').length)}${stat('Hembras',data.animals.filter(x=>x.sex=='Hembra'&&x.status=='Activo').length)}${stat('Machos',data.animals.filter(x=>x.sex=='Macho'&&x.status=='Activo').length)}${stat('Crías',data.offspring.length)}${stat('Ingresos',money(totalIn()))}${stat('Gastos',money(totalOut()))}${stat('Utilidad',money(totalIn()-totalOut()))}${stat('Margen',totalIn()?((totalIn()-totalOut())/totalIn()*100).toFixed(1)+'%':'0%')}</div><div class=card><h3>Acciones rápidas</h3><div class=row><button onclick=animalForm()>+ Animal</button><button onclick=weightForm()>⚖️ Pesaje</button><button onclick=feedForm()>🌾 Alimento</button><button onclick=vetForm()>🩺 Veterinaria</button><button onclick=expenseForm()>💸 Gasto</button><button onclick=saleForm()>🛒 Venta</button></div></div>`,
animals:()=>`<div class=row><h2>Animales</h2><button onclick=animalForm()>+ Registrar</button></div><div id=list></div>`,
reproduction:()=>`<div class=row><h2>Reproducción</h2><button onclick=reproForm()>+ Servicio</button></div><div id=list></div>`,
offspring:()=>`<div class=row><h2>Crías</h2><button onclick=criaForm()>+ Cría</button></div><div id=list></div>`,
feed_records:()=>`<div class=row><h2>Alimentación</h2><button onclick=feedForm()>+ Registro</button></div><div id=list></div>`,
veterinary:()=>`<div class=row><h2>Veterinaria</h2><button onclick=vetForm()>+ Registro</button></div><div id=list></div>`,
money_movements:()=>`<h2>Finanzas</h2><div class=grid>${stat('Ingresos',money(totalIn()))}${stat('Gastos',money(totalOut()))}${stat('Utilidad',money(totalIn()-totalOut()))}${stat('Margen',totalIn()?((totalIn()-totalOut())/totalIn()*100).toFixed(1)+'%':'0%')}</div><div class=card><button onclick=incomeForm()>+ Ingreso</button> <button onclick=expenseForm()>+ Gasto</button></div><div id=list></div>`,
sales:()=>`<div class=row><h2>Ventas</h2><button onclick=saleForm()>+ Venta</button></div><div id=list></div>`,
reports:()=>`<h2>Reportes</h2><div class=card>Ingresos: <b>${money(totalIn())}</b><br>Gastos: <b>${money(totalOut())}</b><br>Utilidad: <b>${money(totalIn()-totalOut())}</b><br>Margen: <b>${totalIn()?((totalIn()-totalOut())/totalIn()*100).toFixed(1):0}%</b></div><div class=card><button onclick=backup()>💾 Exportar respaldo</button></div>`
};
function after(){let t=tab;if(t=='animals')$('list').innerHTML=data.animals.map(x=>`<div class=card><b>${x.ear_tag}</b> ${x.name||''}<br><span class=badge>${x.sex} · ${x.breed||'-'} · ${x.status}</span><div class=row><button onclick="detail('${x.id}')">Ficha</button><button class=danger onclick="del('animals','${x.id}')">Eliminar</button></div></div>`).join('')||'<div class=card>Sin animales.</div>';
if(t=='reproduction')$('list').innerHTML=data.reproduction.map(x=>`<div class=card><b>${tag(x.female_id)}</b> × <b>${tag(x.male_id)}</b> · ${x.service_date}<br>${x.diagnosis||''} · Parto ${x.expected_birth_date||'-'} <button class=danger onclick="del('reproduction','${x.id}')">Eliminar</button></div>`).join('')||'<div class=card>Sin servicios.</div>';
if(t=='offspring')$('list').innerHTML=data.offspring.map(x=>`<div class=card><b>${x.ear_tag}</b> · ${x.sex} · ${x.birth_weight_kg||0} kg · ${x.birth_date}<br>Madre ${tag(x.mother_id)} · Padre ${tag(x.father_id)} <button class=danger onclick="del('offspring','${x.id}')">Eliminar</button></div>`).join('')||'<div class=card>Sin crías.</div>';
if(t=='feed_records')$('list').innerHTML=data.feed_records.map(x=>`<div class=card>${x.record_date} · <b>${x.feed_type}</b> · ${x.quantity_kg} kg · ${money(x.quantity_kg*x.price_per_kg)} <button class=danger onclick="del('feed_records','${x.id}')">Eliminar</button></div>`).join('')||'<div class=card>Sin registros.</div>';
if(t=='veterinary')$('list').innerHTML=data.veterinary.map(x=>`<div class=card><b>${x.record_type}</b> · ${x.record_date} · ${tag(x.animal_id)}<br>${x.medication||''} · ${x.dose||''} · ${x.administration_route||''} · ${money(x.cost)} <button class=danger onclick="del('veterinary','${x.id}')">Eliminar</button></div>`).join('')||'<div class=card>Sin registros.</div>';
if(t=='money_movements')$('list').innerHTML=data.money_movements.map(x=>`<div class=card><b>${x.movement_type}</b> · ${x.movement_date} · ${x.category} · ${money(x.amount)} <button class=danger onclick="del('money_movements','${x.id}')">Eliminar</button></div>`).join('')||'<div class=card>Sin movimientos.</div>';
if(t=='sales')$('list').innerHTML=data.sales.map(x=>`<div class=card><b>${tag(x.animal_id)}</b> · ${x.sale_date}<br>${x.weight_kg} kg × ${money(x.price_per_kg)}/kg = <b>${money(x.total)}</b> <button class=danger onclick="del('sales','${x.id}')">Eliminar</button></div>`).join('')||'<div class=card>Sin ventas.</div>'}
function tag(id){return data.animals.find(x=>x.id==id)?.ear_tag||'-'}function opts(arr){return arr.map(x=>`<option value="${x.id}">${x.ear_tag} · ${x.breed||''}</option>`).join('')}
function modal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}
function animalForm(){modal('Registrar animal',`<form onsubmit="event.preventDefault();add('animals',{ear_tag:a.value.trim(),name:n.value,breed:r.value,sex:s.value,birth_date:d.value||null,entry_date:i.value||null,initial_weight:+w.value||0,purchase_price:+p.value||0,status:st.value,notes:no.value})"><div class=two><div><label>Arete*</label><input id=a required></div><div><label>Nombre</label><input id=n></div><div><label>Sexo</label><select id=s><option>Hembra</option><option>Macho</option></select></div><div><label>Raza</label><input id=r value="Dorper"></div><div><label>Nacimiento</label><input id=d type=date></div><div><label>Ingreso</label><input id=i type=date></div><div><label>Peso inicial kg</label><input id=w type=number step=.01></div><div><label>Precio compra</label><input id=p type=number step=.01></div></div><label>Estado</label><select id=st><option>Activo</option><option>Vendido</option><option>Muerto</option><option>Baja</option></select><label>Notas</label><textarea id=no></textarea><button>Guardar</button></form>`)}
function weightForm(){modal('Nuevo pesaje',`<form onsubmit="event.preventDefault();add('weights',{animal_id:an.value,weight_date:dt.value,weight_kg:+kg.value,feed_consumption_kg:+fd.value||0})"><label>Animal</label><select id=an>${opts(data.animals)}</select><label>Fecha</label><input id=dt type=date value="${today()}"><label>Peso kg</label><input id=kg type=number step=.01 required><label>Alimento kg/día</label><input id=fd type=number step=.01><button>Guardar</button></form>`)}
function reproForm(){let f=data.animals.filter(x=>x.sex=='Hembra'),m=data.animals.filter(x=>x.sex=='Macho');if(!f.length||!m.length)return alert('Registra una hembra y un macho.');modal('Registrar servicio',`<form onsubmit="event.preventDefault();add('reproduction',{female_id:f.value,male_id:m.value,service_date:dt.value,diagnosis:g.value,expected_birth_date:pd.value||null,offspring_count:+c.value||0,notes:no.value})"><label>Hembra</label><select id=f>${opts(f)}</select><label>Macho</label><select id=m>${opts(m)}</select><label>Fecha servicio</label><input id=dt type=date value="${today()}"><label>Diagnóstico</label><select id=g><option>Pendiente</option><option>Gestante</option><option>No gestante</option></select><label>Parto probable</label><input id=pd type=date><label>Crías</label><input id=c type=number min=0><label>Notas</label><textarea id=no></textarea><button>Guardar</button></form>`)}
function criaForm(){let f=data.animals.filter(x=>x.sex=='Hembra'),m=data.animals.filter(x=>x.sex=='Macho');if(!f.length||!m.length)return alert('Registra madre y padre.');modal('Registrar cría',`<form onsubmit="event.preventDefault();add('offspring',{ear_tag:a.value,sex:s.value,birth_date:d.value,birth_weight_kg:+w.value,mother_id:f.value,father_id:m.value})"><label>Arete*</label><input id=a required><label>Sexo</label><select id=s><option>Hembra</option><option>Macho</option></select><label>Fecha nacimiento</label><input id=d type=date value="${today()}"><label>Peso nacimiento kg</label><input id=w type=number step=.01 required><label>Madre</label><select id=f>${opts(f)}</select><label>Padre</label><select id=m>${opts(m)}</select><button>Guardar</button></form>`)}
function feedForm(){modal('Registrar alimentación',`<form onsubmit="event.preventDefault();add('feed_records',{record_date:d.value,feed_type:t.value,quantity_kg:+q.value,price_per_kg:+p.value||0,notes:n.value})"><label>Fecha</label><input id=d type=date value="${today()}"><label>Alimento</label><input id=t required><label>Cantidad kg</label><input id=q type=number step=.01 required><label>Precio/kg</label><input id=p type=number step=.01><label>Notas</label><input id=n><button>Guardar</button></form>`)}
function vetForm(){modal('Registro veterinario',`<form onsubmit="event.preventDefault();add('veterinary',{animal_id:a.value,record_date:d.value,record_type:t.value,medication:m.value,dose:o.value,administration_route:v.value,next_date,note:n.value,cost:+c.value||0})"><label>Animal</label><select id=a>${opts(data.animals)}</select><label>Fecha</label><input id=d type=date value="${today()}"><label>Tipo</label><select id=t><option>Vacuna</option><option>Desparasitación</option><option>Enfermedad</option><option>Tratamiento</option></select><label>Medicamento</label><input id=m><label>Dosis</label><input id=o><label>Vía</label><input id=v><label>Costo</label><input id=c type=number step=.01><label>Notas</label><input id=n><button>Guardar</button></form>`)}
function incomeForm(){modal('Ingreso',`<form onsubmit="event.preventDefault();add('money_movements',{movement_date:d.value,movement_type:'Ingreso',category:c.value,amount:+a.value,cost_type:null,description:n.value})"><label>Fecha</label><input id=d type=date value="${today()}"><label>Categoría</label><input id=c required><label>Monto</label><input id=a type=number step=.01 required><label>Notas</label><input id=n><button>Guardar</button></form>`)}
function expenseForm(){modal('Gasto',`<form onsubmit="event.preventDefault();add('money_movements',{movement_date:d.value,movement_type:'Gasto',category:c.value,amount:+a.value,cost_type:t.value,description:n.value})"><label>Fecha</label><input id=d type=date value="${today()}"><label>Categoría</label><input id=c required><label>Tipo</label><select id=t><option>Fijo</option><option>Variable</option></select><label>Monto</label><input id=a type=number step=.01 required><label>Notas</label><input id=n><button>Guardar</button></form>`)}
function saleForm(){let a=data.animals.filter(x=>x.status=='Activo');if(!a.length)return alert('No hay animales activos.');modal('Venta',`<form onsubmit="event.preventDefault();add('sales',{animal_id:an.value,sale_date:d.value,weight_kg:+w.value,price_per_kg:+p.value,buyer:b.value,notes:n.value})"><label>Animal</label><select id=an>${opts(a)}</select><label>Fecha</label><input id=d type=date value="${today()}"><label>Peso kg</label><input id=w type=number step=.01 required><label>Precio/kg</label><input id=p type=number step=.01 required><label>Comprador</label><input id=b><label>Notas</label><input id=n><button>Guardar</button></form>`)}
function detail(id){let a=data.animals.find(x=>x.id==id),w=data.weights.filter(x=>x.animal_id==id);modal('Ficha '+a.ear_tag,`<p><b>${a.name||''}</b> · ${a.sex} · ${a.breed||'-'}</p><p>Peso inicial: ${a.initial_weight||0} kg · Compra: ${money(a.purchase_price)}</p><h3>Pesajes</h3>${w.map(x=>`<p>${x.weight_date}: <b>${x.weight_kg} kg</b></p>`).join('')||'Sin pesajes'}`)}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='gestion_pecuaria_respaldo.json';a.click()}
async function enter(){let r=await S.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)msg.textContent=r.error.message;else{user=r.data.user;login.style.display='none';await load();render()}}
async function register(){let r=await S.auth.signUp({email:email.value,password:pass.value});msg.textContent=r.error?r.error.message:'Cuenta creada. Revisa tu correo si Supabase solicita confirmación.'}
async function logout(){await S.auth.signOut();location.reload()}
(async()=>{let r=await S.auth.getUser();if(r.data.user){user=r.data.user;login.style.display='none';if(await load())render()}})();
</script></body></html>
